name: Latest blog post workflow

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest Zenn / Qiita posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://zenn.dev/ryokasai/feed,https://qiita.com/RK127/feed"
          max_post_count: 3
          commit_message: "chore(README): update latest blog posts"
